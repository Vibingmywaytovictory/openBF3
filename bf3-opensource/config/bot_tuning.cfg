# The TDM bots' named defaults (docs/design/m2b.md §5, §12 J5; bf3_host tdm_brain.h TdmBotConfig, parsed by
# parse_bot_tuning; as built: docs/design/m2b-bb.md). Every value is [inferred], measured = false: no VU session
# measured BF3's bots (the S5 sessions are parked), so these are the knobs the playtest tunes.
# Format: "key = value", '#' comments, numbers as C decimals. Unknown keys and out-of-range values fail the load.
# The file holds the compiled-in defaults; a key left out keeps its default. The server reads it once at init when
# TdmBotConfig::tuning_cfg names it (tools\play.cmd --tdm does).

# Skill per bot life, uniform in [skill_min, skill_max] from the bot's seed (§5.3, J5).
skill_min = 0.3
skill_max = 0.8
# Reaction delay before the first shot at a new target, by skill (§5.2): the better bots at the fast end.
reaction_min_s = 0.25
reaction_max_s = 0.6
# Target choice (§5.2): w_distance / distance + w_aim (it aims at me) + w_damage (it shot at me in the last
# damage_memory_s) + w_current; a new target must score switch_margin better.
w_distance = 10
w_aim = 0.5
w_damage = 1
w_current = 0.3
damage_memory_s = 3
aims_at_me_deg = 10
switch_margin = 0.25

# Perception (§5.1, research topics/06-bots.md §3.4). Hearing has no AILoudness (-1 in the weapon patches): Q6.
perception.fov_h_deg = 160
perception.fov_v_deg = 90
perception.max_range_m = 120
perception.update_ticks = 6
perception.max_candidates = 4
perception.near_m = 10
perception.detect_near_s = 0.2
perception.far_m = 100
perception.detect_far_s = 1.5
perception.forget_s = 3
perception.hearing_radius_m = 60
perception.hearing_error_m = 5
perception.head_height_m = 1.6
perception.chest_height_m = 1.3

# Aim error (§5.3): sigma = k(skill) (e_inf + (e0 - e_inf) exp(-t / tau)) + moving + crossing x speed;
# k(skill) = max(0.25, 1 + 2 skill_scale (0.5 - skill)).
aim.e0_deg = 3
aim.e_inf_deg = 0.5
aim.tau_s = 0.6
aim.moving_penalty_deg = 1.5
aim.crossing_deg_per_mps = 0.5
aim.skill_scale = 1

# Fighting (§5.5): bursts by range (burst_max_rounds close, burst_min_rounds at 60 m, single shots beyond), one blind
# burst at a lost target's last-known position with blind_fire_share, the M67 at a lost target 15-35 m away at most
# every grenade_every_s, the knife within knife_within_m from behind.
burst_min_rounds = 3
burst_max_rounds = 6
blind_fire_share = 0.5
grenade_min_m = 15
grenade_max_m = 35
grenade_every_s = 20
knife_within_m = 2

# Movement (§5.4): strafe legs of strafe_min_m .. strafe_max_m within engage_strafe_m, push in beyond it, crouch and
# hold beyond crouch_beyond_m (skill > 0.5); hunt_share of the walker's legs go to the brain's goal (the last known
# enemy, a contact heat cell), the rest to S1's random nav points; retreat below retreat_below_hp and wait for regen
# up to regen_wait_s or regen_until_hp.
strafe_min_m = 2
strafe_max_m = 6
engage_strafe_m = 25
crouch_beyond_m = 40
hunt_share = 0.85
heat_cell_m = 16
heat_decay_s = 30
retreat_below_hp = 30
regen_wait_s = 15
regen_until_hp = 90

# Revive (§5.6): an assault bot not engaged for revive_idle_s goes to a downed teammate within revive_radius_m when
# the man-down window outlasts the travel time + revive_margin_s.
revive_radius_m = 30
revive_idle_s = 2
revive_margin_s = 1

# The bot AI ported from OpenBF2 (src/bf3_ai, AISettings). Vehicle and air behaviours stay off until their bodies exist.
ai.max_bots = 64
ai.max_bots_include_humans = true
ai.bot_skill = 0.75
ai.view_distance_m = -1
ai.sai_update_frequency = 35
ai.information_grid_dimension = 32
ai.sides = 2
ai.respawn_allowed = true
ai.auto_spawn_bots = false
ai.enable_vehicle_ai = false
ai.enable_air_ai = false

# The decision layer (src/bf3_ai BotMain): UrgencyMerger picks the behaviour with the largest weight x urge curve,
# the curve being slope x situation + offset (UCLinear). The defaults rank the behaviours as M2b's TdmBrain ranked its
# activities: revive, a grenade in hand, holding cover, an enemy in sight, a grenade throw, blind fire, shot at unseen,
# hunting, roaming, idling. A decision runs when a sense changes and every bb.decision_ticks ticks.
bb.revive.weight = 8
bb.revive.slope = 1
bb.revive.offset = 0
bb.fire_infantery.weight = 7
bb.fire_infantery.slope = 1
bb.fire_infantery.offset = 0
bb.take_cover_infantry.weight = 6
bb.take_cover_infantry.slope = 1
bb.take_cover_infantry.offset = 0
bb.avoid.weight = 1.75
bb.avoid.slope = 1
bb.avoid.offset = 0
bb.move_to.weight = 1.5
bb.move_to.slope = 1
bb.move_to.offset = 0
bb.random.weight = 1
bb.random.slope = 1
bb.random.offset = 0
bb.idle.weight = 0.5
bb.idle.slope = 1
bb.idle.offset = 0
bb.decision_ticks = 6
bb.squad_far_m = 30
bb.squad_arrive_m = 3
