# The TDM bots' named defaults (docs/design/m2b.md §5, §12 J5; bf3_host tdm_brain.h TdmBotConfig, parsed by
# parse_bot_tuning; as built: docs/design/m2b-bb.md). Every value is [inferred], measured = false: no VU session
# measured BF3's bots (the S5 sessions are parked), so these are the knobs the playtest tunes.
# Format: "key = value", '#' comments, numbers as C decimals. Unknown keys and out-of-range values fail the load.
# The file holds the compiled-in defaults; a key left out keeps its default. The server reads it once at init when
# TdmBotConfig::tuning_cfg names it (tools\play.cmd --tdm does).

# Every bot's skill is the AI scripts' aiSettings.setBotSkill (bf3-opensource/ai, 0.75): the first shot at a new target
# waits (1.5 + U[0,1)) x (1 - skill) s and the aim deviation follows the reconstruction's trigger skill (src/bf3_ai
# main/bot_skill.cpp), as BF2 reads botSkill.

# Target choice (§5.2): w_distance / distance + w_aim (it aims at me) + w_damage (it shot at me in the last
# damage_memory_s) + w_current; a new target must score switch_margin better.
w_distance = 10
w_aim = 0.5
w_damage = 1
w_current = 0.3
damage_memory_s = 3
aims_at_me_deg = 10
switch_margin = 0.25

# Perception (§5.1, research topics/06-bots.md §3.4). Hearing has no AILoudness (-1 in the weapon patches): Q6.
perception.fov_h_deg = 160
perception.fov_v_deg = 90
perception.max_range_m = 120
perception.update_ticks = 6
perception.max_candidates = 4
perception.near_m = 10
perception.detect_near_s = 0.2
perception.far_m = 100
perception.detect_far_s = 1.5
perception.forget_s = 3
perception.hearing_radius_m = 60
perception.hearing_error_m = 5
perception.head_height_m = 1.6
perception.chest_height_m = 1.3

# Fighting (§5.5): bursts by range (burst_max_rounds close, burst_min_rounds at 60 m, single shots beyond), one blind
# burst at a lost target's last-known position with blind_fire_share, the M67 at a lost target 15-35 m away at most
# every grenade_every_s, the knife within knife_within_m from behind.
burst_min_rounds = 3
burst_max_rounds = 6
blind_fire_share = 0.5
grenade_min_m = 15
grenade_max_m = 35
grenade_every_s = 20
knife_within_m = 2

# Movement (§5.4): strafe legs of strafe_min_m .. strafe_max_m within engage_strafe_m, push in beyond it, crouch and
# hold beyond crouch_beyond_m (skill > 0.5); hunt_share of the walker's legs go to the brain's goal (the last known
# enemy, a contact heat cell), the rest to S1's random nav points; retreat below retreat_below_hp and wait for regen
# up to regen_wait_s or regen_until_hp.
strafe_min_m = 2
strafe_max_m = 6
engage_strafe_m = 25
crouch_beyond_m = 40
hunt_share = 0.85
heat_cell_m = 16
heat_decay_s = 30
retreat_below_hp = 30
regen_wait_s = 15
regen_until_hp = 90

# Revive (§5.6): an assault bot not engaged for revive_idle_s goes to a downed teammate within revive_radius_m when
# the man-down window outlasts the travel time + revive_margin_s.
revive_radius_m = 30
revive_idle_s = 2
revive_margin_s = 1

# The decision layer (src/bf3_ai BotMain) takes each behaviour's weight and memory curve from the AI scripts
# (bf3-opensource/ai: AIBehaviours.ai, then a level's own Levels/<level>/AI/AI.ai if it has one), as BF2 does; it keeps its choice until
# a behaviour's urgency leaves 0.87..1.15 of its value at the last choice or what it acts on changes (OpenBF2's
# BotMain::decisionMaking). A decision runs when BotManager's schedule takes the bot.
# The support behaviours run while a bot is not engaged (no enemy in sight, not shot at, no grenade or revive under
# way, no hunted enemy within bb.hunt_near_m): a medic throws its medkit at the feet of a mate below bb.assist_below_hp
# within bb.assist_radius_m, or within bb.call_radius_m of a mate calling for a medic; a support soldier throws its
# ammo bag for a mate whose primary reserve is bb.resupply_used_mags magazines below its spawn reserve; a soldier with
# no medkit below bb.call_below_hp calls for at most bb.call_s while a medic or a medkit is within bb.call_radius_m,
# walks into the medkit and stays until bb.assist_below_hp. A thrower closes to bb.throw_m, waits bb.rethrow_s between
# throws and gives a mate up after bb.assist_s spent going to it. A bot moving with its squad, to its formation slot or
# under a squad order to the mission until it is within bb.mission_arrive_m of it, helps only a mate whose detour (to
# the mate, then on to that point, against straight to it) is at most bb.order_detour_m.
bb.squad_far_m = 15
bb.squad_arrive_m = 3
bb.mission_arrive_m = 10
bb.hunt_near_m = 30
bb.assist_radius_m = 15
bb.assist_below_hp = 80
bb.call_below_hp = 50
bb.call_radius_m = 40
bb.call_s = 8
bb.assist_s = 8
bb.rethrow_s = 3
bb.throw_m = 2
bb.resupply_used_mags = 1
bb.order_detour_m = 0

# The team strategy (SAI, OpenBF2's AIStrategic/SAI): a cycle starts every sai.period_ticks, the squad coordinators
# run sai.squad_updates_per_tick a tick in turn. TDM areas whose heat (shots and deaths) reaches sai.hunt_heat make the
# team Hunt there, keeping its target while that area holds sai.hunt_keep of the hottest; otherwise it Spreads. A
# squad order multiplies the behaviour weights by sai.order.*.
# A dead bot's draw must beat sai.squad_spawn_draw for it to spawn on a mate: at 0 every bot tries, and only the
# calm-mate rule refuses, as any higher value (OpenBF2 lets about 70 % through) starts that share of a squad elsewhere.
sai.period_ticks = 30
sai.squad_updates_per_tick = 2
sai.hunt_heat = 2
sai.hunt_keep = 0.5
sai.squad_spawn_draw = 0
sai.order.revive = 1
sai.order.fire_infantery = 1
sai.order.take_cover_infantry = 1
sai.order.avoid = 1
sai.order.move_to = 1.5
sai.order.random = 0.4
sai.order.idle = 1
sai.order.medic_assist = 1
sai.order.call_for_medic = 0.4
sai.order.resupply = 1
