# WHY: a bot's skill (aiSettings.setBotSkill) and its behaviour weights and memory curves come from the AI scripts in
# bf3-opensource/ai, as BF2's do; this file holds the rest (bf3_host tdm_brain.h TdmBotConfig).

# STAND-IN: hand-picked target choice: w_distance / distance + w_aim (it aims at me) + w_damage (it hit me within
# damage_memory_s) + w_current; a new target must score switch_margin better. Settle: a playtest against human play.
w_distance = 10
w_aim = 0.5
w_damage = 1
w_current = 0.3
damage_memory_s = 3
aims_at_me_deg = 10
switch_margin = 0.25

# STAND-IN: hand-picked perception (the 14 keys below). Settle: OpenBF2's sensing values
# (Code/BF2/AI/AIDLL/AI/AIBot/BotSenses.cpp and SensingAgent.cpp @c47317b) or the per-map AI configs.
perception.fov_h_deg = 160
perception.fov_v_deg = 90
perception.max_range_m = 120
perception.update_ticks = 6
perception.max_candidates = 4
perception.near_m = 10
perception.detect_near_s = 0.2
perception.far_m = 100
perception.detect_far_s = 1.5
perception.forget_s = 3
perception.hearing_radius_m = 60
perception.hearing_error_m = 5
perception.head_height_m = 1.6
perception.chest_height_m = 1.3

# STAND-IN: hand-picked bursts by range, blind fire share, grenade window and interval and knife range (7 keys below).
# Settle: OpenBF2 Code/BF2/AI/AIDLL/AI/AIBotBehaviourPattern/BBPFireInfantery.cpp @c47317b or a playtest.
burst_min_rounds = 3
burst_max_rounds = 6
blind_fire_share = 0.5
grenade_min_m = 15
grenade_max_m = 35
grenade_every_s = 20
knife_within_m = 2

# STAND-IN: hand-picked strafe, push, crouch, hunt, heat grid, retreat and regen numbers (the 10 keys below).
# Settle: a playtest of the bots against human play.
strafe_min_m = 2
strafe_max_m = 6
engage_strafe_m = 25
crouch_beyond_m = 40
hunt_share = 0.85
heat_cell_m = 16
heat_decay_s = 30
retreat_below_hp = 30
regen_wait_s = 15
regen_until_hp = 90

# STAND-IN: hand-picked revive radius, idle time and margin over the man-down window (the 3 keys below).
# Settle: OpenBF2 Code/BF2/AI/AIDLL/AI/AIBotBehaviour/BBRevive.cpp @c47317b or a playtest of revives.
revive_radius_m = 30
revive_idle_s = 2
revive_margin_s = 1

# STAND-IN: hand-picked support behaviour distances, health thresholds and timers (the bb.* keys below).
# Settle: OpenBF2 AIBotBehaviour/BBMedicAssist.cpp and BBCallForMedic.cpp @c47317b or a playtest against human play.
bb.squad_far_m = 15
bb.squad_arrive_m = 3
bb.mission_arrive_m = 10
bb.hunt_near_m = 30
bb.assist_radius_m = 15
bb.assist_below_hp = 80
bb.call_below_hp = 50
bb.call_radius_m = 40
bb.call_s = 8
bb.assist_s = 8
bb.rethrow_s = 3
bb.throw_m = 2
bb.resupply_used_mags = 1
bb.order_detour_m = 0

# STAND-IN: hand-picked SAI period, squad updates per tick, hunt heat and keep, and squad order weights (sai.* below).
# Settle: OpenBF2 Code/BF2/AI/AIDLL/AI/AIStrategic/SAI.cpp @c47317b's settings and BF2's strategy files.
sai.period_ticks = 30
sai.squad_updates_per_tick = 2
sai.hunt_heat = 2
sai.hunt_keep = 0.5
sai.order.revive = 1
sai.order.fire_infantery = 1
sai.order.take_cover_infantry = 1
sai.order.avoid = 1
sai.order.move_to = 1.5
sai.order.random = 0.4
sai.order.idle = 1
sai.order.medic_assist = 1
sai.order.call_for_medic = 0.4
sai.order.resupply = 1
