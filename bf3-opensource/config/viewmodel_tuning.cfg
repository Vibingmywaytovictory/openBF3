# WHY: presentation only: no key here touches the sim, the wire or a hash (bf3_anim viewmodel_anim.h ViewmodelTuning).

# STAND-IN: the sway spring and scale (the 6 keys below), hand-tuned: the weapon lags the view rate (metres per
# radian per second, at most sway_max). Settle: retail footage of the 1p weapon's sway.
sway.stiffness = 256
sway.damping = 32
sway.settle_epsilon = 0.001
sway.settle_seconds = 0.75
sway_scale = 0.01
sway_max = 0.05

# STAND-IN: the bob spring and scales (the 7 keys below), hand-tuned: a figure-eight of bob_amplitude metres at
# bob_frequency Hz at 4 m/s. Settle: retail footage of the 1p walk bob.
bob.stiffness = 64
bob.damping = 16
bob.settle_epsilon = 0.001
bob.settle_seconds = 1.0
bob_amplitude = 0.008
bob_frequency = 1.8
bob_ads_scale = 0.2

# STAND-IN: the weapon-local kick per shot (the 7 keys below), hand-tuned (back in metres, muzzle up in degrees,
# with a Fire clip only while aimed). Settle: retail footage of the 1p kick.
kick.stiffness = 900
kick.damping = 60
kick.settle_epsilon = 0.001
kick.settle_seconds = 0.6
kick_back = 0.02
kick_pitch_deg = 1.0
kick_ads_scale = 0.4

# STAND-IN: a hand-tuned presentation camera kick per shot on top of the predicted recoil (the 5 keys below).
# Settle: retail footage of the camera per shot.
camera_recoil.stiffness = 625
camera_recoil.damping = 50
camera_recoil.settle_epsilon = 0.001
camera_recoil.settle_seconds = 0.6
camera_kick_pitch_deg = 0.3

# SOURCE: bf3dump dump of aim_default_ironsight's ZoomTransitionTimeArray (0 to 1 in 0.09 s, 1 to 0 in 0.15 s).
# STAND-IN: used where a controller has no pair entry, where notes R-C3 2a use its ZoomTransitionTime. Settle: R-C3 2a.
ads_in_seconds = 0.09
ads_out_seconds = 0.15
# SOURCE: notes R-C3 2a (the pair's ZoomTransitionTimeArray FovTransitionTime first, else the generic one), as true.
fov_transition_specific = true

# STAND-IN: the idle to sprint blend (s) and the procedural deploy and reload drops (metres below the eye, the 3 keys
# below), in place of animation clips. Settle: the 1p animation clips for those moves.
sprint_blend_seconds = 0.2
deploy_drop = 0.25
reload_drop = 0.12
