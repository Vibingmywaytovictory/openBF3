# 1p viewmodel tuning: the presentation springs and blends the BF3 data does not give (docs/design/m2a.md §11.1,
# §11.2; docs/design/m2a-vm.md; bf3_anim viewmodel_anim.h ViewmodelTuning). Presentation only: nothing here touches
# the sim, the wire or any hash. Every value is [inferred] (tuned by feel, §17) unless marked otherwise.
# Format: "key = value", '#' comments; spring keys are <spring>.stiffness / .damping / .settle_epsilon /
# .settle_seconds (x'' = -stiffness (x - target) - damping x'; damping = 2 sqrt(stiffness) is critical).
# A spring counts as at rest when |x - target| and |x'| are both <= settle_epsilon; anim.viewmodel.unit and
# godot.m2a_viewmodel check that each one comes to rest within settle_seconds once its input stops (E19).

# Sway: the weapon lags the view rate (metres per radian per second, clamped to +- sway_max).
sway.stiffness = 256
sway.damping = 32
sway.settle_epsilon = 0.001
sway.settle_seconds = 0.75
sway_scale = 0.01
sway_max = 0.05

# Bob: a figure-eight at bob_frequency cycles per second at 4 m/s, bob_amplitude metres at 4 m/s; the amplitude
# follows the move speed through the spring.
bob.stiffness = 64
bob.damping = 16
bob.settle_epsilon = 0.001
bob.settle_seconds = 1.0
bob_amplitude = 0.008
bob_frequency = 1.8
bob_ads_scale = 0.2

# Weapon-local kick per shot (back in metres, muzzle up in degrees): the whole kick when the item has no Fire clip
# (the auto rifles), kick_ads_scale of it aimed; with a Fire clip (MK11, SVD, the pistols) only while aimed.
kick.stiffness = 900
kick.damping = 60
kick.settle_epsilon = 0.001
kick.settle_seconds = 0.6
kick_back = 0.02
kick_pitch_deg = 1.0
kick_ads_scale = 0.4

# Camera kick per shot (degrees of pitch, a quarter of it as alternating yaw), on top of the interpolated predicted
# recoil (which the camera adds exactly; this spring is the presentation kick of §11.2).
camera_recoil.stiffness = 625
camera_recoil.damping = 50
camera_recoil.settle_epsilon = 0.001
camera_recoil.settle_seconds = 0.6
camera_kick_pitch_deg = 0.3

# ADS: the aiming controller's ZoomTransitionTime is used when the data has it (iron sights: in 0.09 s, out 0.15 s
# [verified data]); these two are the fallback.
ads_in_seconds = 0.09
ads_out_seconds = 0.15
# World FOV transition time: true = the controller's ZoomLevelSpecificTransitionTime for the transition (iron
# sights 0 -> 1: 0.12 s, 1 -> 0: 0.15 s [verified data]); false = its generic FovTransitionTime (0.15 s) both ways.
fov_transition_specific = true

# Base layer idle <-> sprint (seconds), and the procedural stand-ins (metres below the eye).
sprint_blend_seconds = 0.2
deploy_drop = 0.25
reload_drop = 0.12
