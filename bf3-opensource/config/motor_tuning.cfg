# WHY: the game, the server and the client must hold the same file: MatchInfo's motor digest covers it, and a client
# whose digest differs is refused (bf3_sim soldier_motor.h MotorTuning).

# SOURCE: notes R4-B D and its checker (the character's initial gravity is (0, -9.81, 0) m/s^2).
# INFERRED: no later write changes it. Settle: R4-B's open item on a gravity overwrite.
gravity = 9.81
# SOURCE: notes R-A0 1b and STATUS.md (a fixed 30 Hz sim tick; GameTimeSettings.MaxSimFps defaults to 30).
# INFERRED: the character's gains apply once per 30 Hz sim tick. Settle: a note on the character update's tick rate.
reference_hz = 30
# SOURCE: notes R-B1 G (a gain is the fraction of the gap closed per tick) and its checker (a negative OnGround gain
# moves the velocity by |gain| m/s^2; bf3dump soldier: DecelerationGain -15), the three models below.
acceleration_model = fraction_per_reference_tick
# STAND-IN: linear also runs for positive gains and off the ground, where the checker's branch is OnGround with a
# negative gain. Settle: R-B1's checker on G.
deceleration_model = linear
sprint_model = fraction_per_reference_tick
air_control_scale = 1
# STAND-IN: during a pose transition the slower pose's speeds apply, where notes R-B3 A keep the current pose's speeds
# and hull until the transition completes. Settle: follow R-B3 A.
transition_uses_slower_pose = true
# STAND-IN: JumpPenaltyFactor scales a repeated jump's height, where notes R-B2 A4 and E scale the take-off and ground
# speed by the landing factor. Settle: follow R-B2 E.
jump_penalty_scales_height = true
# STAND-IN: sprint input while crouched or prone asks for Stand; no note gives it. Settle: a note on the sprint input
# in crouch and prone.
sprint_stands_up = true
# STAND-IN: the prone CollisionBoxMin/MaxExpand footprint (0.6 x 2.4 m, bf3dump soldier), 0.35 m high, must be free
# to go prone and to turn, where notes R-B3 E test only the pose's hull. Settle: a note on the prone box.
prone_footprint_check = true
prone_footprint_height = 0.35
# STAND-IN: Jolt CharacterVirtual settings (the six keys below) in place of BF3's character proxy.
# Settle: notes R-B1 J's hull and proxy.
character_padding = 0.02
predictive_contact_distance = 0.1
penetration_recovery_speed = 1
max_collision_iterations = 5
max_constraint_iterations = 15
enhanced_internal_edge_removal = true
# STAND-IN: a pose's shape fits with up to 0.01 m of overlap, where notes R-B3 E allow 0.03 m and ignore contacts near
# the feet. Settle: follow R-B3 E.
pose_change_max_penetration = 0.01
# STAND-IN: an impact below 0.5 m/s is no landing event. Settle: a note on the landing threshold.
min_landing_speed = 0.5
