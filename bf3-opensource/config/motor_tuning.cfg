# Soldier motor tuning: what the BF3 data does not say (docs/design/m1.md §6.4, §6.11; bf3_sim soldier_motor.h
# MotorTuning). Every key below is [inferred]: research defaults until the S5 harness item H:S3 measures them in
# the retail game. Measured values replace the numbers here and need no code change; the game (SharedLoadOptions),
# sim.motor and host.session all read this file, and MatchInfo::motor_hash covers it.
# Format: "key = value", '#' comments; models fraction_per_reference_tick | linear | instant; booleans true/false.

# Soldier gravity in m/s^2 (no soldier gravity in data; the special moves' GravityPoints use -9.81).
gravity = 9.81
# The rate fraction_per_reference_tick gains are read at (BF3 MaxSimFps 30).
reference_hz = 30
# AccelerationGain 0.35 as the fraction of the speed gap closed per 30 Hz tick.
acceleration_model = fraction_per_reference_tick
# |DecelerationGain| 15 as m/s^2.
deceleration_model = linear
# SprintGain 0.25 as the fraction per 30 Hz tick.
sprint_model = fraction_per_reference_tick
# Multiplies the InAir / Falling acceleration and sprint gains (0.1 / 0.05).
air_control_scale = 1
# Speed during a pose transition: the slower pose's (true) or the target's (false).
transition_uses_slower_pose = true
# A second jump within JumpPenaltyTime: JumpPenaltyFactor scales the height (true) or the take-off speed (false).
jump_penalty_scales_height = true
# Sprint input while crouched or prone asks for Stand.
sprint_stands_up = true
# The prone footprint box (CollisionBoxMin/MaxExpand, 0.6 x 2.4 m) must be free to enter prone and to turn.
prone_footprint_check = true
# Height of the prone footprint box above the feet (m).
prone_footprint_height = 0.35
# Jolt CharacterVirtual: the gap kept to geometry (m), the predictive contact distance (m), the penetration recovery
# per update (0..1), the solver's iteration limits.
character_padding = 0.02
predictive_contact_distance = 0.1
penetration_recovery_speed = 1
max_collision_iterations = 5
max_constraint_iterations = 15
enhanced_internal_edge_removal = true
# How deep a target pose's shape may overlap geometry and still fit (m).
pose_change_max_penetration = 0.01
# Impact speeds below this are no landing event (stairs, ramps), m/s.
min_landing_speed = 0.5
