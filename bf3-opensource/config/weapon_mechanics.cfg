# Weapon mechanics the BF3 data does not decide (docs/design/m2a.md §5.5; bf3_sim weapons/mechanics.h Mechanics,
# parsed by weapons/mechanics_tuning.h). Every key below is [unmeasured]: wp's defaults until S5 Session 1 (the VU
# measurement harness) picks a variant; that change is one line per switch plus `measured = true`, no code change.
# Both ends parse this file when they build their weapon table (the server: GunplayConfig::mechanics_cfg; the client:
# ClientSessionConfig::mechanics_cfg). Mechanics is part of weapon_table_hash, which travels in MatchInfo::weapon_hash,
# so a client with another file is refused ("weapon table mismatch", E6). Every report prints "unmeasured" while
# measured = false.
# Format: "key = value", '#' comments; enums by name as below, booleans true/false, numbers as C decimals.

# H:W1 where a shot lands inside the spread cone: uniform_area (radius = spread x sqrt(u)) | uniform_radius (spread x u).
disc = uniform_area
# H:W3 how the recoil offset recovers: linear (factor degrees per second) | exponential (exp(-factor x t)).
recovery = linear
# H:W4 when the first-shot recoil multiplier applies again: on_trigger_release | when_recovered.
first_shot_rearm = on_trigger_release
# H:W2 how the minimum spread rises when the state's minimum goes up: immediate | at_decrease_rate.
min_spread_rise = immediate
# H:W5 bullet damage between the falloff distances (only linear is known).
falloff = linear
# The falloff distance: straight_line (shot origin to hit) | path_length (the path flown).
falloff_basis = straight_line
# Blast damage between InnerBlastRadius and BlastRadius (only linear is known).
blast_falloff = linear
# GunSwayStanceTransition MaxPenaltyValue / CoolDown applied.
stance_transition_penalty = false
# Shots count as suppressed spread at or above this suppression level (SuppressionLowThreshold 0.3).
suppression_threshold = 0.3
# H:W6 DamageProtectionThreshold applied.
apply_protection_threshold = false
# A bullet continues through a soldier (the soldier pairs are penetrable x0.8 in the grid).
bullets_pass_soldiers = false
# Explosion occlusion against the static world.
blast_occlusion = true
# An empty magazine reload gives capacity - 1 (no round chambered, Symthic "30 + 1").
empty_reload_unchambered = true
# Fire refused while sprinting and for RecoverTime (0.12 s) after it.
sprint_blocks_fire = true
# Spawn protection (ImmortalTimeAfterSpawn) refuses damage.
spawn_protection_blocks = true
# SyncedGameSettings.BulletDamageModifier (1 on Metro).
bullet_damage_modifier = 1
# false until S5 Session 1 decides H:W1-H:W9.
measured = false
