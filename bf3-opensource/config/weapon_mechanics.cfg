# WHY: both ends parse this file into their weapon table, whose hash MatchInfo carries, so a client with another file
# is refused (bf3_sim weapons/mechanics.h Mechanics).

# SOURCE: notes R-A4 3 (bullet damage linear between the falloff distances, d the straight line from the origin) and
# R-G4 1 (blast damage linear from InnerBlastRadius to BlastRadius), the three keys below.
falloff = linear
falloff_basis = straight_line
blast_falloff = linear
# STAND-IN: off and read by no code: GunSwayStanceTransition's MaxPenaltyValue and CoolDown are not applied.
# Settle: notes Q2 B3's transition blend.
stance_transition_penalty = false
# STAND-IN: off and read by no code, where notes R-A4 3 zero a hit below DamageProtectionThreshold.
# Settle: apply R-A4 3's threshold.
apply_protection_threshold = false
# STAND-IN: off and read by no code, where notes R-A4 4 let a bullet through a material with the penetrable bit.
# Settle: follow R-A4 4.
bullets_pass_soldiers = false
# INFERRED: a blast is occluded by the static world; notes R-G4 1 name an occlusion factor without its source.
# Settle: a note on the explosion occlusion query.
blast_occlusion = true
# SOURCE: notes R-A3 F (an empty rtMagazineWithPossibleShorterReload reload adds capacity - 1).
empty_reload_unchambered = true
# SOURCE: notes R-A3 K (input held back while sprinting and until SoldierSprintSettingsData.RecoverTime after it).
# INFERRED: the held-back input is fire, as R-A3 K's labels infer. Settle: a note on the sprint input block.
sprint_blocks_fire = true
# SOURCE: notes R2-A5 A2 (an immortal soldier's health does not change).
# INFERRED: spawn protection is that immortal state, as R2-A5 infers.
# Settle: a note naming the state behind R2-A5 A2's immortal query.
spawn_protection_blocks = true
# SOURCE: notes R2-A5 A4 (damage with the bullet flag is multiplied by SyncedGameSettings.BulletDamageModifier).
# STAND-IN: 1 from this file, not read from the server's SyncedGameSettings. Settle: read that setting.
bullet_damage_modifier = 1
measured = false
