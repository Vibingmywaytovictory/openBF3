# Audio tuning: what the BF3 sound data does not say (docs/design/m2a-audio.md §6.6; bf3_audio audio_config.h
# AudioTuning). Every [inferred] key is a default until a measurement replaces it; changing a value needs no code
# change. Ranges are checked: an unknown key, a value outside its range or a malformed line fails the load with the
# line number. Format: "[section]", "key = <float>", '#' comments.

[distance]
# AudioCurve X per metre of emitter distance [inferred: the M16A3 Cone curve reaches -67 dB at X 179; the
# MultiCrossfader distance bands end at 300].
curve_x_metres = 1
# 1 = distances below an output's MinDistance evaluate its curve at MinDistance [inferred].
min_distance_clamp = 1

[filters]
# LPB0 (output low-pass) cutoff at full HF damping and with none [inferred; A3 measures against reference audio].
lpb0_full_damping_hz = 2000
lpb0_open_hz = 20000
# Extra HF loss per metre beyond MinDistance x HFDampingDistance [inferred; off in A2].
hf_damping_db_per_metre = 0

[output]
# The LFE bus folded into stereo until a 5.1 path exists (A3).
lfe_fold_db = -6
# Fixed loudness window until HDR (A3): output gain = Loudness - window_top_db - window_headroom_db.
window_top_db = 115
window_headroom_db = 6
master_gain_db = 0
# Equal-power pan centre level.
pan_law_db = -3

[sampler]
# De-click ramp when a sampler slot is taken over, and the LtInstantRelease fade [inferred].
step_crossfade_ms = 2
release_fade_ms = 5

[mixer]
max_voices = 128
# One control evaluation per Godot mix block (fixed 512 frames).
control_block_frames = 512
