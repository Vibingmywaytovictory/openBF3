# WHY: only what the sound data and the notes do not give has a key here (bf3_audio audio_config.h AudioTuning).

[distance]
# SOURCE: notes R2-D5 3 (the AttenuationCurve's X is metres, its Y dB).
curve_x_metres = 1
# STAND-IN: 1 reads an output's curve at max(d, MinDistance), where notes R2-D5 2 read it at max(0, d - MinDistance).
# Settle: follow R2-D5 2.
min_distance_clamp = 1

[filters]
# STAND-IN: the three filter keys below are hand-picked and read by no code: no output low-pass is built (notes R3-D5
# C give the cutoff chain from 24000 Hz). Settle: build R3-D5 C's chain.
lpb0_full_damping_hz = 2000
lpb0_open_hz = 20000
hf_damping_db_per_metre = 0
# INFERRED: a Butterworth Q, 1/sqrt(2), for the IIR2 high-pass, low-pass and shelf nodes, which have no Q port.
# Settle: a note on those plugins' Q.
iir2_q = 0.70710678

[output]
# STAND-IN: a -6 dB gain on a patch's sends to the LFE bus. Settle: a note on how BF3 plays the LFE bus on stereo.
lfe_fold_db = -6
# STAND-IN: the fixed loudness window (top and headroom, the two keys below) used where no level HdrSetting drives
# notes R-D3's moving window. Settle: R-D3's window from the level's HdrSetting.
window_top_db = 115
window_headroom_db = 6
master_gain_db = 0
# SOURCE: notes R3-D5 test vectors (a centred source gives 0.7071 per side, -3 dB).
pan_law_db = -3

[sampler]
# STAND-IN: a de-click crossfade on a slot takeover and at a segment's end, where notes Q12 4 butt-join segments with
# no fade. Settle: a note on whether the voice player de-clicks.
step_crossfade_ms = 2
# STAND-IN: the fade of a sampler cut, where notes R5-AU2 A3 and A6 stop the voices with no sampler ramp.
# Settle: a note on whether the voice player de-clicks a stop.
release_fade_ms = 5

[mixer]
# STAND-IN: a cap on sounding voices; notes R4-D4 find no global voice cap, only the HDR cull by
# AudioSettings.MaxAudibleSoundCount (notes R-D3 6). Settle: cull by that count as R-D3 6.
max_voices = 128
# STAND-IN: the mixer's fixed 512-frame control block (checked, read by no code), where notes R2-D1 update the audio
# once per rendered frame. Settle: R2-D1's per-frame update.
control_block_frames = 512
# STAND-IN: a new sound starts 2 blocks ahead of the mix clock. Settle: the retail delay from a shot to its sound.
schedule_lead_blocks = 2
