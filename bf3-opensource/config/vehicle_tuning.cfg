# Vehicle tuning: what the BF3 data does not say about driving a wheeled vehicle (docs/design/s2.md §5.3; bf3_sim
# vehicle_model.h VehicleTuning). Every key below is a placeholder [inferred] until S5 Session 2 (harness items
# H:V1-V6) measures the retail Humvee; measured values replace the numbers here and need no code change. Sources:
# IW4L's tuned jeep (crates/vehicle_iw4/src/def.rs, Apache-2.0, the user's own) where it has one, Jolt 5.6.0's
# defaults otherwise. Format: "key = value", '#' comments; booleans true/false.
# Testers cylinder | sphere | ray; steer models scaled_lock | sensitivity_radians.

# m/s^2 before the chassis GravityModifier (Humvee 1.85 -> 18.15 m/s^2).
gravity = 9.81
# Friction of every static body (BF3's material-grid friction is S5's).
ground_friction = 1
# Suspension (IW4L jeep): static sag as a fraction of Spring.Length, damping ratio of the damper.
static_sag_fraction = 0.4375
damping_ratio = 0.45
# Bump stop: min suspension length as a fraction of Spring.Length.
suspension_min_fraction = 0.1
# Wheels: angular damping (Jolt default); max brake torque = BrakeForce x radius x this; hand brake torque (Nm) on
# the non-steering wheels (the data's HandBrakeForce is 0); grip multipliers on Jolt's default friction curves.
wheel_angular_damping = 0.2
brake_torque_per_force = 1
hand_brake_torque = 4000
longitudinal_grip = 1
lateral_grip = 1
tester = cylinder
# Steering: low-speed lock (IW4L jeep 32 degrees) scaled by the data's SteeringSensitivity curve (km/h).
steer_model = scaled_lock
steer_max_degrees = 32
# Engine and gearbox (Jolt VehicleEngineSettings / VehicleTransmissionSettings).
engine_inertia = 0.5
engine_angular_damping = 0.2
shift_up_rpm = 3500
shift_down_rpm = 1500
switch_time = 0.5
clutch_release_time = 0.3
switch_latency = 0.5
clutch_strength = 10
differential_limited_slip = 1.4
# Chassis: N/m per unit of AntiRollBar.Stiffness; air drag multiplier; Jolt max pitch-roll angle (degrees).
anti_roll_scale = 10000
drag_scale = 1
max_pitch_roll_degrees = 180
# Driver: stand-still brake below this speed (m/s); negative throttle selects reverse below this speed (m/s).
stand_still_speed = 0.5
reverse_switch_speed = 1
# Physics step per 60 Hz tick (Jolt defaults for the solver iterations).
collision_steps = 1
velocity_steps = 10
position_steps = 2
