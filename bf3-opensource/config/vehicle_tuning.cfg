# Vehicle tuning: what neither the BF3 data nor the analyst notes give for driving a land vehicle (bf3_sim
# vehicle_model.h VehicleTuning). Every key below is inferred; sources: Jolt 5.6.0's defaults and the earlier code's
# numbers. Format: "key = value", '#' comments; booleans true/false.
# Testers cylinder | sphere | ray. The spring, damper, steer angle, drive share, brakes, air drag, auto brake, tyre forces,
# wheel spin and stand-still rule follow the analyst notes R5-G1-1..8, R6-G1-tyre, R6-G1-apply and R7-G1 and the vehicle
# data and have no key here.

# m/s^2 before the chassis GravityModifier (Humvee 1.85 -> 18.15 m/s^2). The notes did not read the world gravity
# (STATUS, stand-still row); their models assume 9.82.
gravity = 9.81
# Ground friction as the wheels see it while Jolt's tyre friction holds a vehicle (an empty idle one, or one the
# stand-still rule holds): Jolt's tyre x this on a static body; the static bodies themselves keep Jolt's default 0.2,
# identical to CollisionWorld's.
ground_friction = 1
# Bump stop: min suspension length as a fraction of Spring.Length (no note gives one).
suspension_min_fraction = 0.1
# Grip multipliers on Jolt's default friction curves, which act only while Jolt holds a vehicle as above (the tyre
# forces otherwise follow FrictionMethod 0, R6-G1-tyre, and have no key here).
longitudinal_grip = 1
lateral_grip = 1
tester = cylinder
# Chassis: Jolt max pitch-roll angle (degrees).
max_pitch_roll_degrees = 180
# Physics step per 60 Hz tick (Jolt defaults for the solver iterations).
collision_steps = 1
velocity_steps = 10
position_steps = 2
