# WHY: the drive, spring, damper, steer, brakes, tyres, drag and stand-still rule follow the notes and the data; only
# these Jolt and world numbers have keys (bf3_sim vehicle_model.h VehicleTuning).

# STAND-IN: world gravity in m/s^2 before the chassis GravityModifier; the notes never read BF3's (R7-G1-standstill's
# model assumes 9.82). Settle: a note reading the world gravity.
gravity = 9.81
# STAND-IN: Jolt's tyre friction x this on static ground while Jolt holds an idle vehicle; static bodies keep Jolt's
# default 0.2, as CollisionWorld's do. Settle: run R7-G1-standstill's rule for a driverless vehicle.
ground_friction = 1
# STAND-IN: the bump stop, the minimum suspension length as a fraction of Spring.Length; no note gives one.
# Settle: a note on the suspension's lower limit.
suspension_min_fraction = 0.1
# STAND-IN: multipliers on Jolt's default tyre friction curves, which act only while Jolt holds a vehicle
# (FrictionMethod 0, R6-G1-tyre, drives it otherwise). Settle: as ground_friction.
longitudinal_grip = 1
lateral_grip = 1
# STAND-IN: Jolt's wheel collision test (cylinder, sphere or ray) in place of BF3's wheel probe.
# Settle: a note on the wheel probe's shape.
tester = cylinder
# STAND-IN: Jolt's chassis pitch and roll limit in degrees; 180 leaves it off. Settle: a note on a BF3 roll limit.
max_pitch_roll_degrees = 180
# STAND-IN: Jolt's collision steps per 60 Hz tick and its solver velocity and position iterations (Jolt's defaults),
# in place of Havok's solver. Settle: retail handling footage against ours.
collision_steps = 1
velocity_steps = 10
position_steps = 2
