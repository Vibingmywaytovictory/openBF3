# Vehicle tuning: what the BF3 data does not say about driving a wheeled vehicle (docs/design/s2.md §5.3; bf3_sim
# vehicle_model.h VehicleTuning). Every key below is a placeholder [inferred] until S5 Session 2 (harness items
# H:V1-V6) measures the retail Humvee; measured values replace the numbers here and need no code change. Sources:
# Jolt 5.6.0's defaults, and the earlier code's numbers where named below. Format: "key = value", '#' comments;
# booleans true/false.
# Testers cylinder | sphere | ray. The spring, damper, steer angle, drive share, brakes, air drag, auto brake, tyre forces
# and wheel spin follow the analyst notes R5-G1-1..8, R6-G1-tyre and R6-G1-apply and the vehicle data and have no key here.

# m/s^2 before the chassis GravityModifier (Humvee 1.85 -> 18.15 m/s^2).
gravity = 9.81
# Ground friction as the held or stand-still locked wheels see it (Jolt's tyre x this on a static body; the static bodies
# themselves keep Jolt's default 0.2, identical to CollisionWorld's). BF3's material-grid friction is S5's.
ground_friction = 1
# Bump stop: min suspension length as a fraction of Spring.Length.
suspension_min_fraction = 0.1
# Grip multipliers on Jolt's default friction curves, which hold a vehicle only while it is held or stand-still locked
# (the tyre forces otherwise follow FrictionMethod 0, R6-G1-tyre, and have no key here).
longitudinal_grip = 1
lateral_grip = 1
tester = cylinder
# Chassis: Jolt max pitch-roll angle (degrees).
max_pitch_roll_degrees = 180
# Physics step per 60 Hz tick (Jolt defaults for the solver iterations).
collision_steps = 1
velocity_steps = 10
position_steps = 2
