# Vehicle tuning: what the BF3 data does not say about driving a wheeled vehicle (docs/design/s2.md §5.3; bf3_sim
# vehicle_model.h VehicleTuning). Every key below is a placeholder [inferred] until S5 Session 2 (harness items
# H:V1-V6) measures the retail Humvee; measured values replace the numbers here and need no code change. Sources:
# IW4L's tuned jeep (crates/vehicle_iw4/src/def.rs, Apache-2.0, the user's own) where it has one, Jolt 5.6.0's
# defaults otherwise. Format: "key = value", '#' comments; booleans true/false.
# Testers cylinder | sphere | ray. The spring, damper, steer angle, drive share, brakes, air drag and auto brake follow
# the analyst notes R5-G1-1..8 and the vehicle data and have no key here.

# m/s^2 before the chassis GravityModifier (Humvee 1.85 -> 18.15 m/s^2).
gravity = 9.81
# Ground friction as the tyres see it (tyre x this on a static body, in the wheel's friction combine callback; the
# static bodies themselves keep Jolt's default 0.2, identical to CollisionWorld's). BF3's material-grid friction is S5's.
ground_friction = 1
# Bump stop: min suspension length as a fraction of Spring.Length.
suspension_min_fraction = 0.1
# Wheels: angular damping (Jolt default); grip multipliers on Jolt's default friction curves.
wheel_angular_damping = 0.2
longitudinal_grip = 1
lateral_grip = 1
tester = cylinder
# Chassis: Jolt max pitch-roll angle (degrees).
max_pitch_roll_degrees = 180
# The wheel's drive and resistance accumulators (notes R5-G1-1, -5, -8: per substep, one unit) change its spin by
# scale x accumulator x dt / Inertia. The notes did not decode that apply step (R5-G1-vectors); 10 is the earlier
# drive's magnitude, which drives the vehicles where 1 leaves the Humvee at 11 km/h after 10 s. [inferred]
wheel_torque_scale = 10
# Tracked skid stand-in: BF3's track wheels do not steer (notes R5-G1-3 rule 4) and turn the hull through the turn
# term of R5-G1-5, but Jolt's tyre holds a skid turn of unsteered wheels where BF3's FrictionMethod 0 tyre (decoded only
# in part, R5-G1-tyre) lets it slide. Until that tyre is decoded the front track axle turns by this lock and the rear
# against it, scaled by SteeringSensitivity over its value at rest. [inferred]
track_skid_steer_degrees = 32
# Physics step per 60 Hz tick (Jolt defaults for the solver iterations).
collision_steps = 1
velocity_steps = 10
position_steps = 2
