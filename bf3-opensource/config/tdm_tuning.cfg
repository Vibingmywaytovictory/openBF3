# WHY: both ends read this file at the load; the immunity map goes into the motor params, which MatchInfo's motor
# digest covers (bf3_host tdm_rules.h TdmTuning).
# STAND-IN: a dead bot waits up to 8 s for a revive, in place of PlayerKilledDelay, while a living assault mate is
# within 20 m of its corpse. Settle: a playtest of the bots' revives.
revive_wait_radius_m = 20
revive_wait_s = 8

# SOURCE: notes M-OT2 5 (a revive takes the kill back from the killer team's counter).
revive_takes_kill = true
# SOURCE: bf3dump weapon weapons/gadgets/defibrillator/defibrillator (instant hit, 1.75 m/s for 1 s: 1.75 m).
# STAND-IN: 1.8 m is that range rounded up. Settle: the shot's speed x time to live from the data.
defib_range_m = 1.8
# STAND-IN: the corpse sphere a defib shot must enter (centre 0.3 m above the feet, radius 0.6 m) and a living
# soldier's (radius 0.6 m), which refuses the shot. Settle: a note on the defibrillator's target test.
corpse_up_m = 0.3
corpse_radius_m = 0.6
living_radius_m = 0.6

# SOURCE: bf3dump scoring (ID_SCORE_KILL 100, HEADSHOT 10, REVIVE 100, SPAWN_SQUAD 10, REVIVE_SQUAD 110, SQUAD_WIPE 10).
# WHY: the six keys below are fallbacks; the load replaces each with the level's scoring row when it has one.
score_kill = 100
score_headshot = 10
score_revive = 100
score_spawn_squad = 10
score_revive_squad = 110
score_squad_wipe = 10

# STAND-IN: a bot's kit draw weights (assault, engineer, support, recon). Settle: the kit choice of OpenBF2
# Code/BF2/AI/AIDLL/AI/AIStrategicMap/BotSpawner.cpp @c47317b.
bot_kit_weights = 40 20 20 20

# STAND-IN: the nearest-enemy distance beyond which spawn points rank equal (0 ranks by the raw distance); notes M-CQ3
# 6 leave the position choice untraced. Settle: a note on the spawn position choice.
spawn_safe_distance_m = 40
# STAND-IN: the radius of the friendly-death spawn block. Settle: a note on SpawnProtectionFriendlyKilledCount's area.
friendly_block_radius_m = 30
# SOURCE: bf3dump spawns MP_Subway TeamDeathMatch0 (SpawnProtectionFriendlyKilledCount 3, ...KilledTime 30 s).
# STAND-IN: one value pair for every level from this file, not each spawner's own. Settle: read them per spawner.
friendly_block_count = 3
friendly_block_s = 30
# STAND-IN: TryToSpawnOutOfSight's ray budget and the chest height the rays aim at. Settle: a note on
# TryToSpawnOutOfSight (notes M-CQ3 6 leave it untraced).
spawn_los_rays = 16
spawn_chest_height_m = 1.3

# SOURCE: notes M-OT2 retail values (both TDM counters' KillWeights 0, so a teamkill adds 0).
# STAND-IN: one weight from this file, not each counter's TeamKillWeight. Settle: read it as M-OT2 3.
team_kill_weight = 0
# SOURCE: notes M-OT2 retail values (AutoTeam RotateTeamOnNewRound true); true leaves the swap to that data flag.
rotate_teams = true

# SOURCE: bf3dump soldier (AbortSpawnImmortalityInputs 12, 0, 1, 7, 30, 31, 1, 2, 11: raw EntryInputActionEnum values).
# INFERRED: 0 Throttle, 1 Strafe, 7 Fire, used where the type info names none; the rest end nothing.
# Settle: the EBX type info of EntryInputActionEnum.
immunity_abort_map = 0:move 1:move 7:fire

measured = false
