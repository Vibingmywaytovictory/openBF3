# TDM numbers the BF3 data does not decide (docs/design/m2b.md §3.3-§3.6; docs/design/m2b-ru.md §3; parsed by
# bf3_host tdm_rules.h parse_tdm_tuning). Read once at the load with SharedLoadOptions::tdm on both ends; the immunity
# abort below goes into the motor params, so it travels in MatchInfo::motor_hash. Every key is a named default
# [inferred] until a VU measurement replaces it (then one line per key plus `measured = true`); the [verified] ones
# repeat the data (bf3dump) for reference. Format: "key = value", '#' comments; booleans true/false, numbers as C
# decimals.

# Respawn (§3.4): a bot that dies with a living assault teammate within this radius of its corpse waits this long for
# a revive instead of PlayerKilledDelay (5 s, data), inside the 13 s man-down (data).
revive_wait_radius_m = 20
revive_wait_s = 8
# MatchState::restart_tick after UnSpawnAllSoldiers (the graph's own Delay 60 s does the restart; this is the estimate
# the round-end screen shows).
restart_estimate_s = 60

# Revive (§3.6): the killer team's KillCounter takes the kill back (Q2).
revive_takes_kill = true
# [verified: bf3dump weapon defibrillator] MaxRange.
defib_range_m = 1.8
# The corpse sphere a defib shot's segment must enter: centre this far above the feet, this radius.
corpse_up_m = 0.3
corpse_radius_m = 0.6
# A living soldier's sphere (centre 0.9 m up): a defib shot that reaches it is refused and counted.
living_radius_m = 0.6

# Scoring [verified: bf3dump scoring]; the loader replaces them with the data's rows when it reads them.
score_kill = 100
score_headshot = 10
score_revive = 100

# A bot's kit per life (§3.2): weights of assault, engineer, support, recon.
bot_kit_weights = 40 20 20 20

# Spawns (§3.5): the nearest-enemy distance ranks up to this many metres (points beyond it tie and the seeded draw
# picks among them); 0 = the raw distance.
spawn_safe_distance_m = 40
# SpawnProtectionFriendlyKilledCount 3 within 30 s [verified]; the radius is [inferred].
friendly_block_radius_m = 30
friendly_block_count = 3
friendly_block_s = 30
# TryToSpawnOutOfSight: eye-to-chest rays from the 4 nearest enemies to the best 4 points, at most this many.
spawn_los_rays = 16
spawn_chest_height_m = 1.3

# Teams: KillCounter TeamKillWeight is not decoded (Q15); AutoTeam RotateTeamOnNewRound swaps at the restart (Q4).
team_kill_weight = 0
rotate_teams = true

# Health (§3.3): no suppression in M2b, so SuppressionAbortsHealthRegeneration has no input.
suppression_resets_regen = false

# Spawn immunity (§3.3): SoldierDef::abort_spawn_immortality_inputs holds raw EntryInputActionEnum values
# {12, 0, 1, 7, 30, 31, 1, 2, 11} [verified]. When the EBX type info names them the loader maps the names; otherwise
# this map: "value:target" pairs, target move (the two movement axes) or fire / jump / sprint / zoom / reload. Only
# what can be named with confidence: 0 Throttle, 1 Strafe, 7 Fire [inferred].
immunity_abort_map = 0:move 1:move 7:fire

measured = false
